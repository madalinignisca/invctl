# The fragment registry.
#
# Each entry is one manual fragment and everything needed to decide whether it
# is stale. `tools/manual-stale.sh` reads this file and nothing else.
#
# depends_on   the source paths this fragment DESCRIBES. Get these right and
#              staleness is exact; get them wrong and the manual drifts silently,
#              which is the only failure mode of this whole arrangement.
# generated_at the commit the fragment was last written against. Bump it ONLY
#              for the fragment you regenerated.
# preconditions what must be true of the demo estate for the screenshots to
#              teach anything. A page in its boring state loads fine and shows
#              nothing, which is the trap: the capture succeeds and the manual
#              gets worse.
#
# YAML kept to plain lists and scalars on purpose -- the checker parses it with
# sed and awk, so it needs no yaml library on a machine that may not have one.

fragments:
  - id: getting-started
    title: Getting started
    file: parts/00-getting-started.md
    pages:
      - /login
      - /
    screenshots:
      - img/getting-started-1-login.png
      - img/getting-started-2-overview.png
      - img/getting-started-3-rail.png
    depends_on:
      - internal/web/handlers/app.go
      - internal/web/handlers/nav.go
      - internal/web/handlers/misc.go
      - internal/store/findings.go
      - web/templates/layouts/base.html
      - web/templates/pages/dashboard.html
      - web/templates/pages/login.html
    preconditions:
      - "the overview shows at least one finding of each severity (fault, risk, gap)"
      - "no invctl.nav.* keys in localStorage before capturing: a persistent browser profile carries the previous run's expanded groups into the next, and a fresh reader sees everything collapsed"
    generated_at: 7ba77afbb08a

  - id: installation
    title: Installing and running invctl
    file: parts/10-installation.md
    pages: []
    # NO SCREENSHOTS, and that is the honest answer rather than an omission.
    # This fragment documents a systemd unit, a checksum command and an upgrade
    # sequence; a picture of a terminal would be a picture of text somebody
    # cannot copy. The screenshot rules exist to stop a manual describing
    # screens nobody opened, not to require an image per section.
    screenshots: []
    depends_on:
      - cmd/invctl/main.go
      - internal/config/config.go
      - internal/store/migrate.go
      - internal/version/version.go
    preconditions:
      - "none: nothing here is read off a running instance"
    generated_at: 7ba77afbb08a

