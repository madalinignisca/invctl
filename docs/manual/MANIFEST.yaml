# The fragment registry.
#
# Each entry is one manual fragment and everything needed to decide whether it
# is stale. `tools/manual-stale.sh` reads this file and nothing else.
#
# depends_on   the source paths this fragment DESCRIBES. Get these right and
#              staleness is exact; get them wrong and the manual drifts silently,
#              which is the only failure mode of this whole arrangement.
# generated_at the commit the fragment was last written against. Bump it ONLY
#              for the fragment you regenerated.
# preconditions what must be true of the demo estate for the screenshots to
#              teach anything. A page in its boring state loads fine and shows
#              nothing, which is the trap: the capture succeeds and the manual
#              gets worse.
#
# YAML kept to plain lists and scalars on purpose -- the checker parses it with
# sed and awk, so it needs no yaml library on a machine that may not have one.

fragments:
