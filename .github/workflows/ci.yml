name: CI

# The gate is the same one `make lint` and `make test` run locally, deliberately.
# A CI that checks more than the local target teaches people to push and wait; one
# that checks less makes green meaningless. Both run the identical commands.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          test -z "$(gofmt -l cmd internal web)" || {
            gofmt -l cmd internal web
            echo "::error::run gofmt -w"
            exit 1
          }

      - name: go vet
        run: go vet ./...

      # THE ACTION MAJOR AND THE LINTER MAJOR MUST MATCH, and nothing warns you
      # when they stop. .golangci.yml is `version: "2"`, which action v6 cannot
      # load: it refuses at setup with "golangci-lint v2 is not supported by
      # golangci-lint-action v6" and never lints a line.
      #
      # That is how this repository ran for a fortnight. The lint job failed on
      # every push from 2026-08-07 onward while the linter itself had never
      # executed, so 29 findings accumulated behind a step that looked like it
      # was checking them. A gate that fails without running is the same lie as
      # one that passes without running -- both report on work nobody did.
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.1

      # Reachability-aware, unlike a plain dependency scan: it reports only
      # vulnerabilities this code can actually call.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # go.mod and go.sum must already be what `go mod tidy` produces. A drifting
      # go.sum is how an unreviewed dependency arrives.
      - name: go mod tidy is a no-op
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  # TWO JOBS, NOT TWO STEPS, and the difference is the whole point of the split.
  #
  # These were one job until 2026-09-07, with the race run as a second step. The
  # comment on that step said the two were kept apart because "the race detector
  # is slow enough that folding it in would make the fast signal wait for the
  # slow one, and both are worth having" -- which was the right intent and was
  # not what separate STEPS buy. Steps run in sequence and report as one check,
  # so the plain run's result was invisible until the race run finished and the
  # fast signal waited for the slow one exactly as the comment set out to avoid.
  #
  # Measured on run 34136919507 before the split:
  #
  #     test (both engines)        1372s
  #     test -race (both engines)  3845s
  #     everything else              47s
  #
  # So an ordinary broken test took 87 minutes to surface, 74% of it spent
  # proving something unrelated to the failure. As two jobs they start together:
  # the same runner minutes, an ordinary failure visible in about 24 minutes,
  # and the whole gate done in about 65 rather than 87.
  #
  # It also makes the two failures distinguishable at a glance. "tests failed"
  # and "a data race was detected" are different problems with different fixes,
  # and they were one red check.
  #
  # THE DUPLICATION IS DELIBERATE. Both jobs carry the same service block and
  # the same env, because a matrix over `-race` would express the shared half
  # once and then need `if` guards on the timeout, the job name and the cache
  # key -- more machinery than the four lines it would save, and harder to read
  # in the place people read it, which is a failing check's log.
  test:
    runs-on: ubuntu-latest
    services:
      # Two engines is the project's central constraint: a change that only
      # passes on SQLite is not done. Pinned one major behind current stable,
      # per the stack convention.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: invctl
          POSTGRES_PASSWORD: invctl
          POSTGRES_DB: invctl
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U invctl"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      INV_TEST_POSTGRES_DSN: postgres://invctl:invctl@127.0.0.1:5433/invctl?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: CGO_ENABLED=0 go build ./...

      # THE TIMEOUT IS EXPLICIT BECAUSE GO'S DEFAULT IS TEN MINUTES AND THIS
      # SUITE GENUINELY TAKES LONGER. It runs every store test twice -- SQLite
      # in memory and PostgreSQL over a socket -- which is the project's central
      # constraint and not something to trim to fit an arbitrary default.
      #
      # Measured: 586s at v0.2.0 and over the line at v0.3.0, so the release
      # workflow failed on a timeout rather than on a broken test. Thirty
      # minutes is roughly three times the current cost, which leaves room to
      # grow and still fails fast on a genuine hang.
      #
      # If this number needs raising again, that is WP-I3 asking to be done
      # rather than a number to increase.
      - name: test (both engines)
        run: go test ./... -count=1 -timeout 30m

  test-race:
    runs-on: ubuntu-latest
    services:
      # Identical to `test` above, deliberately -- see that job's header for why
      # this is duplicated rather than shared through a matrix.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: invctl
          POSTGRES_PASSWORD: invctl
          POSTGRES_DB: invctl
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U invctl"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      INV_TEST_POSTGRES_DSN: postgres://invctl:invctl@127.0.0.1:5433/invctl?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # NO `build` STEP HERE. `test` above already proves the tree compiles, and
      # this job's own compile happens under -race anyway, so a plain build
      # would be a third compile of the same code proving nothing the other two
      # do not.

      # The race detector instruments every memory access, so it costs roughly
      # 2.8x the plain run on this suite (3845s against 1372s, measured) and
      # gets proportionally more room. `make test-race` is the same command.
      #
      # 60m -> 120m ON 2026-09-09, WHEN internal/store HIT THE CAP OUTRIGHT
      # ("panic: test timed out after 1h0m0s", with the alarm catching a test
      # only 16s in -- so nothing hung; the package simply ran out of budget
      # doing ordinary work).
      #
      # THE HEADROOM WAS NEVER THE SAME AS THE PLAIN JOB'S, and that is the
      # whole finding. Measured over the three preceding merges, internal/store
      # under -race took 2464s, 2967s and 2918s. Against a 60m cap that is 1.2x
      # headroom, while the `test` job above sits at 2.7x (660s against 30m). A
      # suite whose own run-to-run spread is ~20% cannot live inside 1.2x: the
      # cap gets hit by variance alone, by whoever commits next, which is
      # exactly what happened. 120m restores roughly the plain job's ratio.
      #
      # THE `test` JOB'S NOTE SAYS RAISING A TIMEOUT IS "WP-I3 ASKING TO BE DONE
      # RATHER THAN A NUMBER TO INCREASE", AND IT IS RIGHT -- but that is about
      # the measured cost growing, and this is not that. The measured cost has
      # not moved: the plain store run was 661s before this change and 660s
      # after. What moved was nothing; the cap was simply set too close to the
      # measurement to survive normal variance. If the MEASURED figure starts
      # climbing, that note applies in full and this number is not the answer.
      #
      # Considered and rejected: passing -short here, on the theory that the two
      # large-estate builders were the cost. Measured, they are 2.2s -- seconds,
      # not the ~11 minutes that needed explaining -- so it would have bought
      # ~1% while quietly removing two tests from race coverage.
      - name: test -race (both engines)
        run: go test -race ./... -count=1 -timeout 120m
