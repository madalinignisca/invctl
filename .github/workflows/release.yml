name: Release

# TWO WAYS IN, ONE SOURCE OF TRUTH.
#
# This file used to say: "there is no button that builds 'whatever is on main
# right now', which is how a release ends up containing a commit nobody meant to
# ship." That danger is real and the button below does not reintroduce it --
# because the button does not build a moving target. It takes a version AND a
# commit, verifies that exact commit, and creates the tag only once the gate is
# green. The tag is still what the release is cut from; the button just spares
# somebody typing `git tag` and `git push` correctly at the end of a long day.
#
#   1. Push a tag yourself         -> releases that tag, exactly as before.
#   2. Actions -> Release -> Run   -> type the version, pick the commit, go.
#
# The second is the one to use. Nothing is created until the tests pass, so a
# failed run leaves no tag to clean up -- strictly safer than tagging by hand,
# where a red build leaves a tag already pushed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, WITHOUT the leading v. Example: 1.1.0"
        required: true
        type: string
      ref:
        description: "Branch or commit to release from"
        required: true
        default: main
        type: string

# contents: write covers creating the release, uploading the artefacts, and --
# for the button path only -- creating the tag once the gate is green.
permissions:
  contents: write

jobs:
  # EVERYTHING THAT CAN BE KNOWN IN TEN SECONDS IS CHECKED IN TEN SECONDS.
  #
  # The changelog check used to live in the `release` job, at the very end. So a
  # version with no changelog section verified for eight minutes, built,
  # packaged, computed its checksums, and THEN failed -- leaving a red release
  # on a green commit, fixable only by moving a tag. It nearly happened on
  # 1.1.0, where the section was still called [Unreleased].
  #
  # This job answers every such question before a single test runs.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # THE COMMIT IS PINNED HERE AND NOWHERE ELSE. The button takes a
          # branch name, and a branch moves; resolving it to a sha once, up
          # front, is what stops the later jobs building three slightly
          # different trees if somebody merges while this runs. Every job below
          # checks out this sha, never the branch.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          fetch-depth: 0

      - name: resolve the version and the commit
        id: resolve
        env:
          # Through the environment, never interpolated into the script. A
          # workflow that pastes user input straight into a shell command is an
          # injection surface, and `inputs.version` is user input.
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION#v}"      # tolerate someone typing the v
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          # Semver, loosely: three numbers and an optional pre-release. Catches
          # the typo that would otherwise produce a release called "1..1" or
          # "v 1.1.0" and be awkward to withdraw.
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::\"$VERSION\" is not a version. Expected something like 1.1.0 (no leading v)."
            exit 1
          fi

          SHA="$(git rev-parse HEAD)"
          echo "version=$VERSION"  >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"     >> "$GITHUB_OUTPUT"
          echo "sha=$SHA"          >> "$GITHUB_OUTPUT"

          {
            echo "## Releasing \`$VERSION\`"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| tag | \`v$VERSION\` |"
            echo "| commit | \`$SHA\` |"
            echo "| subject | $(git log -1 --format=%s) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: the tag must not exist yet
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG already exists. Releasing over a published tag changes"
            echo "::error::what people already downloaded. Pick the next version instead."
            exit 1
          fi
          echo "$TAG is free."

      - name: the changelog must have a section for this version
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          # The same extraction the release step does, run here so a missing
          # section costs ten seconds instead of a whole pipeline.
          NOTES=$(awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section."
            echo "::error::Rename the [Unreleased] heading to [$VERSION] — <today> and try again."
            exit 1
          fi
          echo "Found $(printf '%s' "$NOTES" | grep -c '^- ') changelog entries for $VERSION."

  # THE GATE RUNS AGAIN ON THE TAG, and yes, CI already ran it on the commit.
  # A tag can be pushed to any commit, including one that never went through a
  # pull request, so "main was green" is not the same statement as "this tag is
  # green". Releasing an unbuilt binary is the one mistake here that reaches
  # other people's servers.
  verify:
    needs: preflight
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: invctl
          POSTGRES_PASSWORD: invctl
          POSTGRES_DB: invctl
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U invctl"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      INV_TEST_POSTGRES_DSN: postgres://invctl:invctl@127.0.0.1:5433/invctl?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./...

      # LINT RUNS HERE TOO, and the reason is not belt-and-braces.
      #
      # CI was red on every push from 2026-08-07 and v0.2.0, v0.3.0 and v0.4.0
      # all shipped anyway -- because this workflow is a different workflow, and
      # it did not ask. A release gate that omits a check the project considers
      # mandatory does not merely fail to catch a problem; it launders a red
      # tree into a signed artefact.
      #
      # Same action major and same pinned version as ci.yml. Two files agreeing
      # by copy is a real risk, and the smaller one than a tag that ships over
      # a gate nobody ran.
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.1

      # THE TIMEOUT IS EXPLICIT BECAUSE GO'S DEFAULT IS TEN MINUTES AND THIS
      # SUITE GENUINELY TAKES LONGER. It runs every store test twice -- SQLite
      # in memory and PostgreSQL over a socket -- which is the project's central
      # constraint and not something to trim to fit an arbitrary default.
      #
      # Measured: 586s at v0.2.0 and over the line at v0.3.0, so the release
      # workflow failed on a timeout rather than on a broken test. Thirty
      # minutes is roughly three times the current cost, which leaves room to
      # grow and still fails fast on a genuine hang.
      #
      # If this number needs raising again, that is WP-I3 asking to be done
      # rather than a number to increase.
      - name: test (both engines)
        run: go test ./... -count=1 -timeout 30m

  build:
    needs: [preflight, verify]
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: the version string comes from `git describe`, and
      # a shallow clone would produce a build that cannot name itself.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # `make build` rather than `go build`: the CSS is generated by the
      # Tailwind step the target depends on, and a plain go build would embed
      # whatever web/static/app.css happened to be in the tree.
      #
      # SOURCE_DATE_EPOCH is taken from git rather than the event payload.
      # The commit's own author date is a property of the tagged commit, so
      # rebuilding this tag next year produces the same bytes; the push
      # timestamp would have made every rebuild differ. It also keeps event
      # data out of a shell command entirely, which is the rule that stops a
      # workflow becoming an injection surface.
      - name: build
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          make build
          ./bin/invctl -version

      # The name says what it is and what it runs on. Somebody downloading this
      # in six months has only the filename to go on.
      - name: package
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          mkdir -p dist
          cp bin/invctl "dist/invctl_${VERSION}_linux_amd64"
          cp LICENSE README.md CHANGELOG.md dist/
          cd dist
          # Checksums, because a binary downloaded over a link somebody pasted
          # into a chat is a binary nobody verified. sha256sum -c reads this
          # file directly.
          sha256sum "invctl_${VERSION}_linux_amd64" > "invctl_${VERSION}_checksums.txt"
          cat "invctl_${VERSION}_checksums.txt"

      # THE TAG IS CREATED HERE, AFTER THE GATE, AND ONLY FOR THE BUTTON.
      #
      # Tagging by hand pushes the tag first and finds out afterwards, so a red
      # build leaves a tag already published that somebody has to delete. This
      # way round, a failed run leaves nothing behind.
      #
      # Pushing with GITHUB_TOKEN deliberately does NOT start another run of
      # this workflow -- GitHub suppresses that to stop workflows triggering
      # themselves -- so the tag-push trigger above stays quiet and this run
      # continues straight into the release below.
      - name: create the tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
          SHA: ${{ needs.preflight.outputs.sha }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          # AN ANNOTATED TAG NEEDS A COMMITTER, and a runner has none. `git tag
          # -a` records who made the tag and when, so it fails with "empty ident
          # name" on a fresh runner where user.name and user.email are unset.
          # This is the canonical identity GitHub uses for its own bot, so the
          # tag is attributed to the automation rather than to whoever happened
          # to click the button.
          #
          # Repository-local, not --global: nothing else on this runner should
          # inherit an identity set for one tag.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$SHA" -m "invctl $VERSION"
          git push origin "$TAG"

      - name: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.preflight.outputs.version }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          # --notes-from-tag would use the tag message; the changelog is the
          # curated version and is what somebody upgrading needs to read.
          # Extracted here rather than duplicated into the release body by hand.
          NOTES=$(awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          # The body somebody actually lands on: the changelog for this
          # version, then the install and verification boilerplate from
          # .github/release-footer.md.
          #
          # The footer is a FILE rather than a heredoc in this workflow, for two
          # reasons. A heredoc containing "---" at column zero terminates the
          # YAML block scalar this step is written in, which is a confusing
          # failure to debug; and boilerplate somebody will want to reword
          # should not live inside workflow syntax. Substitution is envsubst
          # over a named allow-list, so nothing else in the file can expand.
          {
            printf '%s\n' "$NOTES"
            envsubst '$GITHUB_REPOSITORY $TAG $VERSION' < .github/release-footer.md
          } > notes.md
          gh release create "$TAG" \
            --title "invctl $VERSION" \
            --notes-file notes.md \
            "dist/invctl_${VERSION}_linux_amd64" \
            "dist/invctl_${VERSION}_checksums.txt"
