# Ansible's default roles_path search does NOT include a playbook directory's
# sibling roles/ -- it looks under the playbook's OWN directory (here,
# playbooks/roles), which does not exist. Without this, `roles: - role: invctl`
# in playbooks/invctl.yml fails to resolve. Pointing roles_path at roles/
# directly is simpler than relocating the playbook or the role.
[defaults]
roles_path = ./roles
